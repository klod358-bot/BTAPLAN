<title>План перехода БТА — вход</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@600&display=swap">
<style>
:root{--bg:#f6f7f9;--surface:#fff;--fg:#1b2230;--muted:#5d6676;--line:#dfe3ea;--accent:#2f5d9e;--bad:#c43d3d;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#12161d;--surface:#1a2029;--fg:#e6eaf0;--muted:#9aa4b3;--line:#2c3440;--accent:#7fa8e6;--bad:#e46a6a;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;display:grid;place-items:center;padding:16px}
form{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;display:flex;flex-direction:column;gap:14px}
h1{font-family:"Unbounded","Golos Text",sans-serif;font-weight:600;font-size:20px;margin:0}
p{margin:0;color:var(--muted);font-size:13px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:600;background:var(--accent);color:var(--surface);border:0;border-radius:8px;padding:11px;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.err{color:var(--bad);font-size:13px;min-height:1.2em}
</style>
</head>

</form>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function keyFrom(secret){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(secret),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.s),iterations:P.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
}
async function open(key){
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.i)},key,b64(P.c));
  const html=new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
(async()=>{ try{ const raw=sessionStorage.getItem("bta-k"); if(raw){ const k=await crypto.subtle.importKey("raw",b64(raw),"AES-GCM",true,["decrypt"]); await open(k); } }catch(e){ try{sessionStorage.removeItem("bta-k")}catch(_){} } })();
document.getElementById("f").addEventListener("submit",async ev=>{
  ev.preventDefault(); const e=document.getElementById("e"), btn=document.getElementById("b");
  btn.disabled=true; e.textContent="Проверяю…";
  try{
    const k=await keyFrom(document.getElementById("u").value.trim()+":"+document.getElementById("p").value);
    const raw=new Uint8Array(await crypto.subtle.exportKey("raw",k));
    await open(k);
    try{ sessionStorage.setItem("bta-k",btoa(String.fromCharCode(...raw))); }catch(_){}
  }catch(err){ e.textContent="Неверный логин или пароль."; btn.disabled=false; }
});
